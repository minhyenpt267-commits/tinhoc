<style>
:root{
  --giay:#F2F6FC;
  --oli:#CFE0F4;
  --oli-dam:#A9C8E8;
  --muc:#1B4B8F;
  --muc-dam:#0F2E5C;
  --but-do:#D93B3B;
  --sticker:#FFC93C;
  --dung:#2E9E5B;
  --chu:#1F2A37;
  --xam:#6B7A8F;
  --trang:#FFFFFF;
  --go:#F0DCB4;
  --bong:0 2px 0 var(--oli-dam), 0 6px 18px rgba(27,75,143,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Be Vietnam Pro','Segoe UI',Tahoma,sans-serif;
  font-size:19px;
  line-height:1.55;
  color:var(--chu);
  background-color:var(--giay);
  background-image:
    repeating-linear-gradient(to right, var(--oli) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(to bottom, var(--oli) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(to right, var(--oli-dam) 0 1.5px, transparent 1.5px 104px),
    repeating-linear-gradient(to bottom, var(--oli-dam) 0 1.5px, transparent 1.5px 104px);
  min-height:100vh;
  padding:0 0 60px;
}

.khung{max-width:880px;margin:0 auto;padding:0 18px}

h1,h2,h3,.hienthi{font-family:'Baloo 2','Segoe UI',Tahoma,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.2}

/* ---------- Thanh đầu trang ---------- */
.dau{
  background:var(--muc);
  color:#fff;
  padding:14px 0;
  margin-bottom:26px;
  box-shadow:0 3px 0 rgba(15,46,92,.35);
}
.dau .khung{display:flex;align-items:center;gap:14px}
.huy-hieu{
  width:44px;height:44px;flex:0 0 44px;border-radius:10px;
  background:var(--sticker);
  display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--muc-dam);
}
.dau h1{font-size:26px;color:#fff;flex:1}
.dau .phu{font-size:14px;font-weight:400;color:#BBD2EF;display:block;letter-spacing:0;font-family:'Be Vietnam Pro',sans-serif}

/* ---------- Thẻ giấy ---------- */
.the{
  background:var(--trang);
  border:2px solid var(--oli-dam);
  border-radius:14px;
  box-shadow:var(--bong);
  padding:22px;
  margin-bottom:20px;
}

/* ---------- Nút ---------- */
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--but-do);outline-offset:3px}

.nut{
  background:var(--muc);color:#fff;
  border-radius:12px;
  padding:14px 26px;
  min-height:52px;
  font-weight:600;
  box-shadow:0 3px 0 var(--muc-dam);
  transition:transform .08s;
}
.nut:hover{background:#22589F}
.nut:active{transform:translateY(3px);box-shadow:none}
.nut.phu{background:var(--trang);color:var(--muc);border:2px solid var(--muc);box-shadow:0 3px 0 var(--oli-dam)}
.nut.phu:hover{background:#EAF1FB}
.nut[disabled]{background:#B6C4D6;box-shadow:0 3px 0 #93A3B8;cursor:not-allowed}

/* ---------- Trang chủ: 3 chế độ ---------- */
.chedo{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.the-chedo{
  background:var(--trang);
  border:2px solid var(--oli-dam);
  border-radius:16px;
  box-shadow:var(--bong);
  padding:24px 18px;
  text-align:left;
  transition:transform .12s, border-color .12s;
}
.the-chedo:hover{transform:translateY(-3px);border-color:var(--muc)}
.the-chedo .bieutuong{font-size:34px;line-height:1;display:block;margin-bottom:10px}
.the-chedo h3{font-size:21px;color:var(--muc);margin-bottom:6px}
.the-chedo p{font-size:15px;color:var(--xam);line-height:1.45}

/* ---------- Chọn chủ đề ---------- */
.luoi-chude{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.o-chude{
  display:flex;align-items:center;gap:14px;
  background:var(--trang);border:2px solid var(--oli-dam);border-radius:12px;
  padding:14px 16px;text-align:left;box-shadow:0 2px 0 var(--oli-dam);
}
.o-chude:hover{border-color:var(--muc);background:#F7FAFE}
.o-chude .so{
  width:38px;height:38px;flex:0 0 38px;border-radius:9px;
  background:var(--muc);color:#fff;display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;
}
.o-chude .ten{font-weight:600;font-size:16px;line-height:1.3}
.o-chude .dem{font-size:13px;color:var(--xam)}

/* ---------- Thước kẻ tiến độ (điểm nhấn) ---------- */
.thuoc{
  position:relative;height:40px;border-radius:7px;margin-bottom:22px;
  background:var(--go);
  border:2px solid #D9BE8A;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);
  background-image:repeating-linear-gradient(to right,
    #B99659 0 1.5px, transparent 1.5px 10%);
  background-position:left top;
}
.thuoc::after{
  content:'';position:absolute;left:0;right:0;top:0;height:12px;
  background-image:repeating-linear-gradient(to right,#B99659 0 1.5px, transparent 1.5px 2%);
}
.con-truot{
  position:absolute;top:-9px;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:15px solid var(--but-do);
  transform:translateX(-11px);
  transition:left .3s ease;
}
.nhan-thuoc{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:#7A5C28;
}

/* ---------- Câu hỏi ---------- */
.dong-tren{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.the-mucdo{
  display:inline-block;font-size:13px;font-weight:600;
  background:#EAF1FB;color:var(--muc);border-radius:20px;padding:4px 12px;
}
.dong-ho{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--muc);
  background:#EAF1FB;border-radius:10px;padding:4px 14px;
}
.dong-ho.gap{color:var(--but-do);background:#FCECEC}

.de-bai{font-size:23px;font-weight:600;line-height:1.45;margin-bottom:20px}
.hinh-mo-ta{
  font-family:ui-monospace,'Consolas',monospace;font-size:16px;
  background:#F7FAFE;border:2px dashed var(--oli-dam);border-radius:10px;
  padding:14px 16px;margin-bottom:18px;white-space:pre-wrap;line-height:1.6;
}

.dap-an{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pa{
  display:flex;align-items:center;gap:14px;
  background:var(--trang);border:2px solid var(--oli-dam);border-radius:12px;
  padding:14px 16px;text-align:left;min-height:64px;
  box-shadow:0 2px 0 var(--oli-dam);
  transition:border-color .12s;
}
.pa:hover:not([disabled]){border-color:var(--muc);background:#F7FAFE}
.pa .chu-cai{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  background:#EAF1FB;color:var(--muc);display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;
}
.pa.dung{border-color:var(--dung);background:#EDF9F1}
.pa.dung .chu-cai{background:var(--dung);color:#fff}
.pa.sai{border-color:var(--but-do);background:#FCECEC}
.pa.sai .chu-cai{background:var(--but-do);color:#fff}
.pa.chon{border-color:var(--muc);background:#EAF1FB}
.pa[disabled]{cursor:default}

/* Đúng/Sai */
.dong-ds{
  display:flex;align-items:center;gap:12px;
  border-bottom:1.5px solid var(--oli);padding:12px 0;flex-wrap:wrap;
}
.dong-ds .noi-dung{flex:1;min-width:220px;font-size:18px}
.nut-ds{
  border:2px solid var(--oli-dam);border-radius:10px;background:var(--trang);
  padding:8px 18px;min-height:46px;font-weight:600;box-shadow:0 2px 0 var(--oli-dam);
}
.nut-ds.chon{background:var(--muc);color:#fff;border-color:var(--muc)}
.nut-ds.dung{background:var(--dung);color:#fff;border-color:var(--dung)}
.nut-ds.sai{background:var(--but-do);color:#fff;border-color:var(--but-do)}

/* Sắp xếp */
.buoc{
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--trang);border:2px solid var(--oli-dam);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;text-align:left;min-height:60px;
  box-shadow:0 2px 0 var(--oli-dam);
}
.buoc:hover:not([disabled]){border-color:var(--muc)}
.buoc .thu-tu{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;
  background:#EAF1FB;color:var(--muc);display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;
}
.buoc.da-chon .thu-tu{background:var(--muc);color:#fff}
.buoc.dung{border-color:var(--dung);background:#EDF9F1}
.buoc.sai{border-color:var(--but-do);background:#FCECEC}

/* Nối cột */
.noi{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cot h4{font-size:15px;color:var(--xam);margin-bottom:10px;font-family:'Be Vietnam Pro',sans-serif;font-weight:600}
.muc-noi{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--trang);border:2px solid var(--oli-dam);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;text-align:left;min-height:58px;font-size:17px;
  box-shadow:0 2px 0 var(--oli-dam);
}
.muc-noi:hover:not([disabled]){border-color:var(--muc)}
.muc-noi.dang-chon{border-color:var(--muc);background:#EAF1FB}
.muc-noi .cap{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
  background:#EAF1FB;color:var(--muc);
}
.muc-noi.da-noi .cap{background:var(--sticker);color:var(--muc-dam)}
.muc-noi.dung{border-color:var(--dung);background:#EDF9F1}
.muc-noi.sai{border-color:var(--but-do);background:#FCECEC}

/* Tự luận */
textarea{
  width:100%;min-height:120px;font-family:inherit;font-size:18px;line-height:1.6;
  border:2px solid var(--oli-dam);border-radius:12px;padding:14px;resize:vertical;
  background:var(--trang);color:var(--chu);
}
textarea:focus{outline:none;border-color:var(--muc)}

/* ---------- Phản hồi ---------- */
.phan-hoi{
  display:flex;align-items:flex-start;gap:14px;
  border-radius:12px;padding:16px 18px;margin-top:18px;
}
.phan-hoi.tot{background:#EDF9F1;border:2px solid var(--dung)}
.phan-hoi.chua{background:#FFF6E0;border:2px solid var(--sticker)}
.phan-hoi .dau-hieu{font-size:30px;line-height:1;flex:0 0 auto}
.phan-hoi .tieu{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;margin-bottom:3px}
.phan-hoi .loi{font-size:17px;line-height:1.5}

.hien-len{animation:hien .25s ease}
@keyframes hien{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.dong-duoi{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

/* ---------- Kết quả ---------- */
.diem-lon{text-align:center;padding:14px 0 6px}
.diem-lon .con-so{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:76px;line-height:1;color:var(--muc);
}
.diem-lon .tren{font-size:16px;color:var(--xam)}
.hang-sticker{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;font-size:28px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;margin-top:16px;font-size:17px}
th,td{text-align:left;padding:11px 10px;border-bottom:1.5px solid var(--oli)}
th{font-size:14px;color:var(--xam);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
td.giua,th.giua{text-align:center}
.thanh{height:9px;border-radius:5px;background:var(--oli);overflow:hidden;min-width:70px}
.thanh i{display:block;height:100%;background:var(--dung);border-radius:5px}
.thanh.yeu i{background:var(--but-do)}

.can-on{background:#FFF6E0;border:2px solid var(--sticker);border-radius:12px;padding:16px 18px;margin-top:18px}
.can-on h4{font-family:'Baloo 2',sans-serif;font-size:18px;margin-bottom:8px}
.can-on ul{margin-left:22px}
.can-on li{margin-bottom:4px;font-size:17px}

/* ---------- Bảng cô giáo ---------- */
.ghi-chu{font-size:15px;color:var(--xam);line-height:1.5;margin-top:10px}
.canh-bao{background:#FCECEC;border:2px solid var(--but-do);border-radius:10px;padding:12px 14px;font-size:16px;margin-top:12px}
.thanh-cong{background:#EDF9F1;border:2px solid var(--dung);border-radius:10px;padding:12px 14px;font-size:16px;margin-top:12px}
.lien-ket{background:none;color:var(--muc);text-decoration:underline;font-size:16px;padding:0;min-height:0}

@media (max-width:640px){
  body{font-size:18px}
  .khung{padding:0 12px}
  .chedo{grid-template-columns:1fr}
  .luoi-chude{grid-template-columns:1fr}
  .dap-an{grid-template-columns:1fr}
  .noi{grid-template-columns:1fr}
  .de-bai{font-size:20px}
  .dau h1{font-size:21px}
  .diem-lon .con-so{font-size:60px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

/* ======================================================================
   TRẠNG THÁI
   ====================================================================== */
const TU_CHAM = ["tu_luan_ngan","quan_sat_hinh"];
const KHEN = ["Giỏi lắm!","Chính xác!","Tuyệt vời!","Đúng rồi!","Em làm tốt lắm!"];
const DONG_VIEN = ["Chưa đúng rồi","Suýt nữa thì đúng","Cùng xem lại nhé"];

let phien = null;
const mh = document.getElementById('man-hinh');

function tron(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function ngauNhien(a){return a[Math.floor(Math.random()*a.length)]}

/* ======================================================================
   TRANG CHỦ
   ====================================================================== */
function trangChu(){
  phien=null;
  const tuCham=NGAN_HANG.filter(c=>TU_CHAM.includes(c.dang)).length;
  mh.innerHTML=`
    <div class="chedo">
      <button class="the-chedo" data-mo="chude">
        <span class="bieutuong">📚</span>
        <h3>Ôn theo chủ đề</h3>
        <p>Chọn một chủ đề em muốn ôn. Làm thong thả, sai được làm lại.</p>
      </button>
      <button class="the-chedo" data-mo="nhanh">
        <span class="bieutuong">⚡</span>
        <h3>Luyện nhanh</h3>
        <p>10 câu bất kì. Khoảng 5 phút là xong.</p>
      </button>
      <button class="the-chedo" data-mo="thi">
        <span class="bieutuong">📝</span>
        <h3>Thi thử</h3>
        <p>Đề rút theo ma trận, có đồng hồ 35 phút như bài kiểm tra thật.</p>
      </button>
    </div>
    <div class="the">
      <h3 style="font-size:19px;color:var(--muc);margin-bottom:8px">Ngân hàng hiện có ${NGAN_HANG.length} câu hỏi</h3>
      <p class="ghi-chu" style="margin-top:0">${tuCham} câu tự luận sẽ hiện đáp án gợi ý để em tự đối chiếu, không tính vào điểm thi thử.</p>
    </div>`;
  mh.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mo;
    if(m==='chude')chonChuDe();
    else if(m==='nhanh')batDau(tron(NGAN_HANG).slice(0,10),{ten:'Luyện nhanh',phanHoiNgay:true});
    else rutDeThi();
  });
}

/* ======================================================================
   CHỌN CHỦ ĐỀ
   ====================================================================== */
function chonChuDe(){
  const o=Object.keys(TEN_CHU_DE).map(k=>{
    const n=NGAN_HANG.filter(c=>c.chu_de==k).length;
    return `<button class="o-chude" data-cd="${k}" ${n?'':'disabled style="opacity:.45"'}>
      <span class="so">${k}</span>
      <span><span class="ten">${esc(TEN_CHU_DE[k])}</span><br><span class="dem">${n} câu hỏi</span></span>
    </button>`;
  }).join('');
  mh.innerHTML=`<div class="the">
    <h2 style="font-size:24px;color:var(--muc);margin-bottom:16px">Em muốn ôn chủ đề nào?</h2>
    <div class="luoi-chude">${o}</div>
    <div class="dong-duoi"><button class="nut phu" id="ve">Quay về</button></div>
  </div>`;
  mh.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{
    const cd=b.dataset.cd;
    batDau(tron(NGAN_HANG.filter(c=>c.chu_de==cd)),{ten:'Chủ đề '+cd+' — '+TEN_CHU_DE[cd],phanHoiNgay:true});
  });
  document.getElementById('ve').onclick=trangChu;
}

/* ======================================================================
   RÚT ĐỀ THI THỬ THEO MA TRẬN 40 / 40 / 20
   ====================================================================== */
function rutDeThi(){
  const chamDuoc=NGAN_HANG.filter(c=>!TU_CHAM.includes(c.dang));
  const theoMuc={1:tron(chamDuoc.filter(c=>c.muc_do===1)),
                 2:tron(chamDuoc.filter(c=>c.muc_do===2)),
                 3:tron(chamDuoc.filter(c=>c.muc_do===3))};
  const canDiem={1:4,2:4,3:2};
  const de=[]; const thieu=[];
  [1,2,3].forEach(m=>{
    let d=0, soCauLon=0;
    // theoMuc[m] đã được trộn ngẫu nhiên; xếp câu nhiều điểm lên trước để đề ngắn lại
    for(const c of theoMuc[m].slice().sort((a,b)=>b.diem-a.diem)){
      if(d>=canDiem[m]) break;
      if(d+c.diem>canDiem[m]) continue;      // bỏ qua câu làm vượt quá điểm của mức này
      if(c.diem>=2){ if(soCauLon>=1) continue; soCauLon++; }  // mỗi mức nhiều nhất một câu nối cột
      de.push(c); d+=c.diem;
    }
    if(d<canDiem[m]) thieu.push(`mức ${m} còn thiếu ${(canDiem[m]-d).toFixed(2).replace(/\.?0+$/,'')} điểm`);
  });
  if(!de.length){ mh.innerHTML=`<div class="the"><div class="canh-bao">Ngân hàng chưa có câu hỏi nào chấm tự động được.</div>
    <div class="dong-duoi"><button class="nut phu" id="ve">Quay về</button></div></div>`;
    document.getElementById('ve').onclick=trangChu; return; }
  batDau(tron(de),{ten:'Thi thử',phanHoiNgay:false,giay:35*60,canhBao:thieu});
}

/* ======================================================================
   VÒNG LÀM BÀI
   ====================================================================== */
function batDau(ds,tuyChon){
  if(!ds.length){trangChu();return}
  phien={ds,i:0,ketQua:[],...tuyChon,batDauLuc:Date.now()};
  if(phien.giay){
    phien.conLai=phien.giay;
    phien.dongHo=setInterval(()=>{
      phien.conLai--;
      const e=document.getElementById('dong-ho');
      if(e){e.textContent=dinhDangGio(phien.conLai);e.classList.toggle('gap',phien.conLai<=300)}
      if(phien.conLai<=0){clearInterval(phien.dongHo);ketThuc(true)}
    },1000);
  }
  veCauHoi();
}
function dinhDangGio(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function veCauHoi(){
  const c=phien.ds[phien.i];
  const pt=(phien.i/phien.ds.length)*100;
  let than='';
  if(c.dang==='trac_nghiem_4') than=veTracNghiem(c);
  else if(c.dang==='dung_sai') than=veDungSai(c);
  else if(c.dang==='sap_xep') than=veSapXep(c);
  else if(c.dang==='noi_cot') than=veNoiCot(c);
  else than=veTuLuan(c);

  mh.innerHTML=`
    <div class="thuoc" role="progressbar" aria-valuenow="${phien.i+1}" aria-valuemin="1" aria-valuemax="${phien.ds.length}">
      <span class="con-truot" style="left:${pt}%"></span>
      <span class="nhan-thuoc">Câu ${phien.i+1} / ${phien.ds.length}</span>
    </div>
    <div class="the">
      <div class="dong-tren">
        <span class="the-mucdo">${esc(phien.ten)} · Mức ${c.muc_do}</span>
        ${phien.giay?`<span class="dong-ho" id="dong-ho">${dinhDangGio(phien.conLai)}</span>`:''}
      </div>
      <p class="de-bai">${esc(c.cau_hoi)}</p>
      ${c.mo_ta_hinh?`<div class="hinh-mo-ta">${esc(c.mo_ta_hinh)}</div>`:''}
      <div id="vung-tra-loi">${than}</div>
      <div id="vung-phan-hoi"></div>
      <div class="dong-duoi" id="vung-nut"></div>
    </div>`;
  if(c.dang==='trac_nghiem_4') ganTracNghiem(c);
  else if(c.dang==='dung_sai') ganDungSai(c);
  else if(c.dang==='sap_xep') ganSapXep(c);
  else if(c.dang==='noi_cot') ganNoiCot(c);
  else ganTuLuan(c);
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- Trắc nghiệm ---------- */
function veTracNghiem(c){
  return '<div class="dap-an">'+c.phuong_an.map((p,i)=>
    `<button class="pa" data-i="${i}"><span class="chu-cai">${'ABCD'[i]}</span><span>${esc(p)}</span></button>`).join('')+'</div>';
}
function ganTracNghiem(c){
  mh.querySelectorAll('.pa').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, dung=i===c.dap_an;
    mh.querySelectorAll('.pa').forEach((x,j)=>{
      x.disabled=true;
      if(phien.phanHoiNgay){
        if(j===c.dap_an) x.classList.add('dung');
        else if(j===i) x.classList.add('sai');
      }else if(j===i) x.classList.add('chon');
    });
    ghiNhan(c,dung?1:0);
  });
}

/* ---------- Đúng / Sai ---------- */
function veDungSai(c){
  return c.cac_y.map((y,i)=>
    `<div class="dong-ds" data-y="${i}">
       <span class="noi-dung">${esc(y)}</span>
       <button class="nut-ds" data-y="${i}" data-v="1">Đúng</button>
       <button class="nut-ds" data-y="${i}" data-v="0">Sai</button>
     </div>`).join('');
}
function ganDungSai(c){
  const chon=new Array(c.cac_y.length).fill(null);
  mh.querySelectorAll('.nut-ds').forEach(b=>b.onclick=()=>{
    const y=+b.dataset.y;
    chon[y]=b.dataset.v==='1';
    mh.querySelectorAll(`.nut-ds[data-y="${y}"]`).forEach(x=>x.classList.remove('chon'));
    b.classList.add('chon');
    if(chon.every(v=>v!==null)) nutXong.disabled=false;
  });
  const nutXong=themNut('Kiểm tra',()=>{
    let dung=0;
    c.cac_y.forEach((_,i)=>{
      const d=chon[i]===c.dap_an[i]; if(d)dung++;
      mh.querySelectorAll(`.nut-ds[data-y="${i}"]`).forEach(x=>{
        x.disabled=true;
        if(!phien.phanHoiNgay)return;
        const v=x.dataset.v==='1';
        if(v===c.dap_an[i]) x.classList.add('dung');
        else if(v===chon[i]) x.classList.add('sai');
      });
    });
    ghiNhan(c,dung/c.cac_y.length);
  });
  nutXong.disabled=true;
}

/* ---------- Sắp xếp ---------- */
function veSapXep(c){
  return c.cac_buoc.map((b,i)=>
    `<button class="buoc" data-i="${i}"><span class="thu-tu">·</span><span>${esc(b)}</span></button>`).join('')
    +'<p class="ghi-chu">Bấm lần lượt từ bước làm trước đến bước làm sau.</p>';
}
function ganSapXep(c){
  let thuTu=[];
  const ve=()=>mh.querySelectorAll('.buoc').forEach(b=>{
    const v=thuTu.indexOf(+b.dataset.i);
    b.classList.toggle('da-chon',v>=0);
    b.querySelector('.thu-tu').textContent=v>=0?v+1:'·';
  });
  mh.querySelectorAll('.buoc').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(thuTu.includes(i)) thuTu=thuTu.filter(x=>x!==i); else thuTu.push(i);
    ve(); nutXong.disabled=thuTu.length!==c.cac_buoc.length;
  });
  const nutXong=themNut('Kiểm tra',()=>{
    const dung=thuTu.every((v,i)=>v===c.dap_an[i]);
    mh.querySelectorAll('.buoc').forEach(b=>{
      b.disabled=true;
      if(!phien.phanHoiNgay)return;
      const i=+b.dataset.i, vt=c.dap_an.indexOf(i);
      b.classList.add(thuTu[vt]===i?'dung':'sai');
      b.querySelector('.thu-tu').textContent=vt+1;
    });
    ghiNhan(c,dung?1:0);
  });
  nutXong.disabled=true;
}

/* ---------- Nối cột ---------- */
function veNoiCot(c){
  const thuTuB=tron(c.cot_b.map((t,i)=>({t,i})));
  return `<div class="noi">
    <div class="cot"><h4>Bộ phận</h4>${c.cot_a.map((t,i)=>
      `<button class="muc-noi" data-ben="a" data-i="${i}"><span class="cap">${i+1}</span><span>${esc(t)}</span></button>`).join('')}</div>
    <div class="cot"><h4>Chức năng</h4>${thuTuB.map((o,j)=>
      `<button class="muc-noi" data-ben="b" data-i="${o.i}"><span class="cap">?</span><span>${esc(o.t)}</span></button>`).join('')}</div>
  </div><p class="ghi-chu">Bấm một ô bên trái, rồi bấm ô bên phải để nối hai ô lại với nhau.</p>`;
}
function ganNoiCot(c){
  let dangChon=null; const cap={};
  const oA=[...mh.querySelectorAll('.muc-noi[data-ben="a"]')];
  const oB=[...mh.querySelectorAll('.muc-noi[data-ben="b"]')];
  oA.forEach(b=>b.onclick=()=>{
    oA.forEach(x=>x.classList.remove('dang-chon'));
    dangChon=+b.dataset.i; b.classList.add('dang-chon');
  });
  oB.forEach(b=>b.onclick=()=>{
    if(dangChon===null)return;
    const bi=+b.dataset.i;
    Object.keys(cap).forEach(k=>{if(cap[k]===bi)delete cap[k]});
    cap[dangChon]=bi;
    oA.forEach(x=>{
      const co=cap[+x.dataset.i]!==undefined;
      x.classList.toggle('da-noi',co); x.classList.remove('dang-chon');
    });
    oB.forEach(x=>{
      const k=Object.keys(cap).find(k=>cap[k]===+x.dataset.i);
      x.classList.toggle('da-noi',k!==undefined);
      x.querySelector('.cap').textContent=k!==undefined?(+k+1):'?';
    });
    dangChon=null;
    nutXong.disabled=Object.keys(cap).length!==c.cot_a.length;
  });
  const nutXong=themNut('Kiểm tra',()=>{
    let dung=0;
    c.cot_a.forEach((_,i)=>{ if(cap[i]===c.dap_an[i])dung++; });
    if(phien.phanHoiNgay){
      oA.forEach(x=>{const i=+x.dataset.i; x.classList.add(cap[i]===c.dap_an[i]?'dung':'sai')});
      oB.forEach(x=>{
        const i=+x.dataset.i, k=c.dap_an.indexOf(i);
        x.classList.add(cap[k]===i?'dung':'sai');
        x.querySelector('.cap').textContent=k+1;
      });
    }
    [...oA,...oB].forEach(x=>x.disabled=true);
    ghiNhan(c,dung/c.cot_a.length);
  });
  nutXong.disabled=true;
}

/* ---------- Tự luận ---------- */
function veTuLuan(c){
  return `<textarea id="bai-lam" placeholder="Em viết câu trả lời vào đây..." aria-label="Câu trả lời của em"></textarea>`;
}
function ganTuLuan(c){
  themNut('Xem đáp án gợi ý',()=>{
    document.getElementById('bai-lam').disabled=true;
    document.getElementById('vung-phan-hoi').innerHTML=
      `<div class="phan-hoi chua hien-len"><span class="dau-hieu">💡</span>
        <span><span class="tieu">Đáp án gợi ý</span>
        <span class="loi">${esc(c.dap_an_goi_y||'')}</span>
        <span class="loi" style="display:block;margin-top:8px;color:var(--xam)">Câu này em tự đối chiếu với bài làm của mình, hoặc nhờ thầy cô chấm giúp.</span></span></div>`;
    document.getElementById('vung-nut').innerHTML='';
    themNut(phien.i+1<phien.ds.length?'Câu tiếp theo':'Xem kết quả',()=>tiepTuc());
    phien.ketQua.push({c,ti:null});
  });
}

/* ---------- Chung ---------- */
function themNut(nhan,fn,phu){
  const b=document.createElement('button');
  b.className='nut'+(phu?' phu':''); b.textContent=nhan; b.onclick=fn;
  document.getElementById('vung-nut').appendChild(b); return b;
}

function ghiNhan(c,ti){
  phien.ketQua.push({c,ti});
  document.getElementById('vung-nut').innerHTML='';
  if(phien.phanHoiNgay){
    const tot=ti===1;
    document.getElementById('vung-phan-hoi').innerHTML=
      `<div class="phan-hoi ${tot?'tot':'chua'} hien-len"><span class="dau-hieu">${tot?'⭐':'💡'}</span>
        <span><span class="tieu">${tot?ngauNhien(KHEN):ngauNhien(DONG_VIEN)}</span>
        <span class="loi">${esc(c.giai_thich||'')}</span></span></div>`;
  }
  themNut(phien.i+1<phien.ds.length?'Câu tiếp theo':'Xem kết quả',()=>tiepTuc());
}

function tiepTuc(){
  phien.i++;
  if(phien.i<phien.ds.length) veCauHoi(); else ketThuc(false);
}

/* ======================================================================
   KẾT QUẢ
   ====================================================================== */
function ketThuc(hetGio){
  if(phien.dongHo)clearInterval(phien.dongHo);
  const cham=phien.ketQua.filter(k=>k.ti!==null);
  const tongDiem=cham.reduce((s,k)=>s+k.c.diem,0);
  const duocDiem=cham.reduce((s,k)=>s+k.c.diem*k.ti,0);
  const thang10=tongDiem?duocDiem/tongDiem*10:0;
  const lamTron=Math.round(thang10);
  const soSao=Math.max(1,Math.round(lamTron/2));

  const theoCD={};
  cham.forEach(k=>{
    const cd=k.c.chu_de;
    theoCD[cd]=theoCD[cd]||{d:0,t:0,so:0};
    theoCD[cd].d+=k.c.diem*k.ti; theoCD[cd].t+=k.c.diem; theoCD[cd].so++;
  });
  const yeu=Object.keys(theoCD).filter(cd=>theoCD[cd].d/theoCD[cd].t<0.6);

  const bang=Object.keys(theoCD).sort().map(cd=>{
    const o=theoCD[cd], pt=Math.round(o.d/o.t*100);
    return `<tr><td>${cd}. ${esc(TEN_CHU_DE[cd])}</td>
      <td class="giua">${o.so}</td>
      <td class="giua">${pt}%</td>
      <td><span class="thanh ${pt<60?'yeu':''}"><i style="width:${pt}%"></i></span></td></tr>`;
  }).join('');

  const tuChamSo=phien.ketQua.length-cham.length;

  mh.innerHTML=`
    <div class="the">
      ${hetGio?'<div class="canh-bao">Đã hết 35 phút. Bài của em được chấm với những câu đã làm.</div>':''}
      ${(phien.canhBao&&phien.canhBao.length)?`<div class="canh-bao">Ghi chú cho giáo viên: ngân hàng chưa đủ câu nên đề rút ra chưa trọn 10 điểm (${esc(phien.canhBao.join('; '))}).</div>`:''}
      <div class="diem-lon">
        <div class="tren">${esc(phien.ten)} — điểm của em</div>
        <div class="con-so">${lamTron}</div>
        <div class="tren">trên thang điểm 10${tongDiem?` (đúng ${duocDiem.toFixed(2).replace(/\.?0+$/,'')}/${tongDiem.toFixed(2).replace(/\.?0+$/,'')} điểm)`:''}</div>
        <div class="hang-sticker">${'⭐'.repeat(soSao)}</div>
      </div>
      ${bang?`<table><thead><tr><th>Chủ đề</th><th class="giua">Số câu</th><th class="giua">Làm đúng</th><th></th></tr></thead><tbody>${bang}</tbody></table>`:''}
      ${tuChamSo?`<p class="ghi-chu">${tuChamSo} câu tự luận không tính vào điểm. Em nhờ thầy cô chấm giúp nhé.</p>`:''}
      ${yeu.length?`<div class="can-on"><h4>Em nên ôn lại</h4><ul>${yeu.map(cd=>`<li>Chủ đề ${cd}: ${esc(TEN_CHU_DE[cd])}</li>`).join('')}</ul></div>`
        :`<div class="can-on" style="background:#EDF9F1;border-color:var(--dung)"><h4>Em nắm bài rất chắc</h4><p style="font-size:17px">Không có chủ đề nào dưới 60%. Em thử chế độ Thi thử để luyện làm bài đúng giờ nhé.</p></div>`}
      <div class="dong-duoi">
        <button class="nut" id="lam-lai">Làm lại</button>
        <button class="nut phu" id="ve">Về trang chính</button>
      </div>
    </div>`;
  document.getElementById('ve').onclick=trangChu;
  document.getElementById('lam-lai').onclick=()=>{
    const t={ten:phien.ten,phanHoiNgay:phien.phanHoiNgay,giay:phien.giay};
    batDau(tron(phien.ds),t);
  };
}

/* ======================================================================
   BẢNG CÔ GIÁO
   ====================================================================== */
function bangCoGiao(){
  const o={};
  NGAN_HANG.forEach(c=>{const k=c.chu_de+'-'+c.muc_do;o[k]=(o[k]||0)+1});
  let hang='';
  for(let cd=1;cd<=6;cd++){
    hang+=`<tr><td>${cd}. ${esc(TEN_CHU_DE[cd])}</td>`;
    for(let m=1;m<=3;m++){
      const n=o[cd+'-'+m]||0;
      hang+=`<td class="giua" style="${n<3?'color:var(--but-do);font-weight:600':''}">${n}</td>`;
    }
    hang+='</tr>';
  }
  mh.innerHTML=`
    <div class="the">
      <h2 style="font-size:23px;color:var(--muc);margin-bottom:6px">Bảng dành cho giáo viên</h2>
      <p class="ghi-chu" style="margin-top:0">Số câu hiện có trong từng ô của ma trận. Ô đỏ là ô còn quá ít câu để rút đề đa dạng — mỗi ô nên có từ 8 câu trở lên.</p>
      <table><thead><tr><th>Chủ đề</th><th class="giua">Mức 1</th><th class="giua">Mức 2</th><th class="giua">Mức 3</th></tr></thead><tbody>${hang}</tbody></table>
    </div>
    <div class="the">
      <h3 style="font-size:19px;color:var(--muc);margin-bottom:8px">Nạp ngân hàng câu hỏi riêng</h3>
      <p class="ghi-chu" style="margin-top:0;margin-bottom:12px">Dán nội dung file JSON của cô vào ô dưới rồi bấm Nạp. Ngân hàng cũ sẽ được thay thế.</p>
      <textarea id="json-moi" placeholder='{ "cau_hoi": [ ... ] }' style="min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:15px"></textarea>
      <div id="bao" ></div>
      <div class="dong-duoi">
        <button class="nut" id="nap">Nạp ngân hàng</button>
        <button class="nut phu" id="ve">Quay về</button>
      </div>
    </div>`;
  document.getElementById('ve').onclick=trangChu;
  document.getElementById('nap').onclick=()=>{
    const bao=document.getElementById('bao');
    try{
      const d=JSON.parse(document.getElementById('json-moi').value);
      const ds=Array.isArray(d)?d:d.cau_hoi;
      if(!Array.isArray(ds)||!ds.length) throw new Error('Không tìm thấy danh sách câu hỏi.');
      const thieu=ds.findIndex(c=>!c.cau_hoi||!c.dang||c.chu_de==null||c.muc_do==null);
      if(thieu>=0) throw new Error(`Câu thứ ${thieu+1} thiếu một trong các trường: cau_hoi, dang, chu_de, muc_do.`);
      NGAN_HANG=ds;
      bao.innerHTML=`<div class="thanh-cong">Đã nạp ${ds.length} câu hỏi. Bấm Quay về để bắt đầu dùng.</div>`;
    }catch(e){
      bao.innerHTML=`<div class="canh-bao">Không nạp được: ${esc(e.message)}</div>`;
    }
  };
}

document.getElementById('nut-co-giao').onclick=bangCoGiao;
trangChu();
</script>
