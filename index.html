<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mưa Chữ Cái — Luyện Gõ 10 Ngón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#bfe6ff;
    --sky-bottom:#eaf7ff;
    --ink:#233047;
    --coral:#ff6f61;
    --coral-dark:#e6543f;
    --sun:#ffc93c;
    --leaf:#5ec269;
    --grape:#9b6bd9;
    --card:#ffffff;
    --cloud:#ffffff;
    --shadow: 0 10px 24px rgba(35,48,71,0.15);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #ffffff 100%);
    overflow:hidden;
  }
  h1,h2,h3, .display{
    font-family:'Baloo 2', cursive;
  }

  /* decorative clouds */
  .cloud{
    position:fixed; background:var(--cloud); border-radius:50px;
    opacity:0.9; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.05));
    z-index:0;
  }
  .cloud::before, .cloud::after{
    content:""; position:absolute; background:var(--cloud); border-radius:50%;
  }

  #app{ position:relative; width:100%; height:100vh; z-index:1; }

  /* ---------- SETUP SCREEN ---------- */
  #setup{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .panel{
    background:var(--card);
    border-radius:28px;
    box-shadow: var(--shadow);
    padding: 32px 36px 28px;
    max-width: 760px;
    width:100%;
    max-height: 92vh;
    overflow-y:auto;
  }
  .title-row{ text-align:center; margin-bottom: 6px; }
  .title-row h1{
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 4px;
    color: var(--coral-dark);
    letter-spacing: 0.5px;
  }
  .title-row .subtitle{
    margin:0; color:#5b6b85; font-weight:600; font-size:15px;
  }
  .section-label{
    font-family:'Baloo 2', cursive;
    font-size: 18px; font-weight:700; margin: 22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .badge-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--sun); color:#5c3d00; font-size:14px; font-weight:800;
  }

  .finger-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  @media (max-width:600px){ .finger-grid{ grid-template-columns: repeat(2, 1fr);} }

  .finger-btn{
    border: 2.5px solid #e3ecf7;
    background:#f7fbff;
    border-radius:16px;
    padding:10px 8px;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink);
    text-align:center;
    transition: all .15s ease;
    line-height:1.3;
  }
  .finger-btn .hand-dot{
    width:14px;height:14px;border-radius:50%;
    background:#cfe0f5; margin:0 auto 6px;
  }
  .finger-btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px rgba(35,48,71,0.12); }
  .finger-btn.selected{
    border-color: var(--coral);
    background: #fff1ef;
    color: var(--coral-dark);
  }
  .finger-btn.selected .hand-dot{ background: var(--coral); }
  .finger-btn .keys{
    display:block; margin-top:3px; font-size:12px; color:#8a97ab; font-weight:600;
  }
  .finger-btn.selected .keys{ color: var(--coral-dark); opacity:0.8;}
  .finger-btn.all-fingers{
    grid-column: span 3;
  }
  @media (max-width:600px){ .finger-btn.all-fingers{ grid-column: span 2; } }

  .speed-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .speed-btn{
    flex:1; min-width:110px;
    border:2.5px solid #e3ecf7;
    background:#f7fbff;
    border-radius:16px;
    padding:14px 10px;
    cursor:pointer;
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:16px;
    color: var(--ink);
    transition: all .15s ease;
    text-align:center;
  }
  .speed-btn .emoji{ font-size:22px; display:block; margin-bottom:4px; }
  .speed-btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px rgba(35,48,71,0.12);}
  .speed-btn.selected{ border-color: var(--leaf); background:#effaf0; color:#2a7d3a;}

  .start-btn{
    display:block; width:100%; margin-top: 26px;
    background: linear-gradient(180deg, #ff8a7a, var(--coral));
    color:white; border:none; border-radius:20px;
    padding:16px; font-family:'Baloo 2', cursive; font-size:22px; font-weight:800;
    letter-spacing:0.5px;
    cursor:pointer; box-shadow: 0 8px 0 var(--coral-dark), 0 12px 20px rgba(230,84,63,0.35);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .start-btn:active{ transform: translateY(6px); box-shadow: 0 2px 0 var(--coral-dark), 0 6px 10px rgba(230,84,63,0.3); }
  .start-btn:disabled{
    background:#cfd6e0; box-shadow:none; cursor:not-allowed; color:#8a97ab;
  }
  .hint{ text-align:center; font-size:13px; color:#8a97ab; margin-top:10px; font-weight:600; min-height:18px;}

  /* ---------- GAME SCREEN ---------- */
  #game{
    position:absolute; inset:0; display:none;
    flex-direction:column;
  }
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 22px;
    z-index:5;
  }
  .hud-chip{
    background:rgba(255,255,255,0.85);
    border-radius:16px; padding:8px 16px;
    box-shadow: var(--shadow);
    font-family:'Baloo 2', cursive; font-weight:700; font-size:16px;
    display:flex; align-items:center; gap:8px;
  }
  .hud-chip .label{ font-size:12px; color:#8a97ab; font-family:'Quicksand'; font-weight:700; }
  #timeChip.warning{ color:var(--coral-dark); }
  #stopBtn{
    background:white; border:2px solid #e3ecf7; border-radius:14px;
    padding:8px 14px; font-family:'Quicksand'; font-weight:700; cursor:pointer;
    color:#5b6b85;
  }
  #stopBtn:hover{ background:#f7fbff; }

  #playfield{
    position:relative; flex:1; overflow:hidden;
    background: linear-gradient(180deg, #d8f0ff 0%, #f2fbff 100%);
    margin: 0 16px 16px;
    border-radius: 24px;
    box-shadow: inset 0 2px 10px rgba(35,48,71,0.06);
  }
  .ground-line{
    position:absolute; left:0; right:0; bottom:56px;
    border-top: 3px dashed #ffb199;
    opacity:0.6;
  }
  .falling-letter{
    position:absolute;
    top:-60px;
    width:56px; height:56px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', cursive; font-weight:800; font-size:26px;
    color:white;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    user-select:none;
    will-change: transform;
  }
  .falling-letter.pop{
    animation: popOut .25s ease forwards;
  }
  @keyframes popOut{
    0%{ transform:scale(1); opacity:1;}
    100%{ transform:scale(1.6); opacity:0;}
  }
  .falling-letter.missed{
    animation: sink .35s ease forwards;
  }
  @keyframes sink{
    0%{ transform:scale(1); opacity:1;}
    100%{ transform:scale(0.7) translateY(6px); opacity:0;}
  }

  #finish-flash{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background: rgba(35,48,71,0.35);
    z-index:10;
  }
  .result-card{
    background:white; border-radius:28px; padding:36px 40px; text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    max-width: 420px; width:90%;
  }
  .result-card h2{ margin:6px 0 2px; font-size:28px; color:var(--coral-dark); }
  .result-card .big-score{
    font-family:'Baloo 2', cursive; font-size:64px; font-weight:800; color:var(--leaf);
    margin: 10px 0 0;
  }
  .result-card .score-label{ color:#5b6b85; font-weight:700; font-size:14px; margin-bottom: 4px;}
  .result-card .stats{ display:flex; justify-content:center; gap:22px; margin: 18px 0 6px; }
  .stat-box{ background:#f7fbff; border-radius:14px; padding:10px 14px; min-width:80px;}
  .stat-box .num{ font-family:'Baloo 2', cursive; font-size:22px; font-weight:700; color:var(--ink);}
  .stat-box .lbl{ font-size:11px; color:#8a97ab; font-weight:700; }
  .result-card .praise{ font-size:15px; font-weight:700; color:#5b6b85; margin: 8px 0 20px;}
  .again-btn{
    background: linear-gradient(180deg, #ff8a7a, var(--coral));
    color:white; border:none; border-radius:16px;
    padding:12px 28px; font-family:'Baloo 2', cursive; font-size:18px; font-weight:800;
    cursor:pointer; box-shadow: 0 6px 0 var(--coral-dark);
  }
  .again-btn:active{ transform: translateY(4px); box-shadow:none; }

  .confetti{
    position:absolute; width:8px; height:14px; top:-20px; opacity:0.9;
    animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:0.3; }
  }

  @media (prefers-reduced-motion: reduce){
    .falling-letter, .confetti, .again-btn, .start-btn { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="cloud" style="width:120px;height:44px; top:8%; left:6%;"></div>
<div class="cloud" style="width:90px;height:34px; top:16%; left:80%;"></div>
<div class="cloud" style="width:70px;height:28px; top:6%; left:45%;"></div>

<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup">
    <div class="panel">
      <div class="title-row">
        <h1>🌧️ Mưa Chữ Cái</h1>
        <p class="subtitle">Luyện gõ 10 ngón dành cho học sinh tiểu học</p>
      </div>

      <div class="section-label"><span class="badge-num">1</span> Chọn ngón tay muốn luyện</div>
      <div class="finger-grid" id="fingerGrid"></div>

      <div class="section-label"><span class="badge-num">2</span> Chọn tốc độ rơi</div>
      <div class="speed-row" id="speedRow">
        <div class="speed-btn" data-speed="slow"><span class="emoji">🐢</span>Chậm</div>
        <div class="speed-btn" data-speed="medium"><span class="emoji">🐇</span>Trung bình</div>
        <div class="speed-btn" data-speed="fast"><span class="emoji">🚀</span>Nhanh</div>
      </div>

      <button class="start-btn" id="startBtn" disabled>▶ BẮT ĐẦU (10 phút)</button>
      <p class="hint" id="hint">Hãy chọn ngón tay và tốc độ nhé!</p>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game">
    <div id="hud">
      <div class="hud-chip">⌨️ <span id="fingerLabel">—</span></div>
      <div class="hud-chip" id="timeChip">⏳ <span id="timeLeft">10:00</span></div>
      <div class="hud-chip">⭐ <span class="label">Số chữ đúng:&nbsp;</span><span id="scoreVal">0</span></div>
      <button id="stopBtn">⏹ Dừng lại</button>
    </div>
    <div id="playfield">
      <div class="ground-line"></div>
    </div>
  </div>

</div>

<script>
(function(){
  // ---------- Cấu hình ngón tay & phím tương ứng ----------
  const FINGER_GROUPS = [
    { id:'lp',  name:'Út (trái)',     keys:['Q','A','Z'] },
    { id:'lr',  name:'Áp út (trái)',  keys:['W','S','X'] },
    { id:'lm',  name:'Giữa (trái)',   keys:['E','D','C'] },
    { id:'li',  name:'Trỏ (trái)',    keys:['R','F','V','T','G','B'] },
    { id:'ri',  name:'Trỏ (phải)',    keys:['Y','H','N','U','J','M'] },
    { id:'rm',  name:'Giữa (phải)',   keys:['I','K'] },
    { id:'rr',  name:'Áp út (phải)',  keys:['O','L'] },
    { id:'rp',  name:'Út (phải)',     keys:['P'] },
  ];
  const ALL_KEYS = FINGER_GROUPS.flatMap(f=>f.keys);

  const SPEED_CONFIG = {
    slow:   { fall: 55,  spawnMs: 1500 },  // px/giây, tần suất rơi
    medium: { fall: 95,  spawnMs: 1100 },
    fast:   { fall: 145, spawnMs: 800  },
  };
  const SPEED_LABELS = { slow:'Chậm 🐢', medium:'Trung bình 🐇', fast:'Nhanh 🚀' };

  const COLORS = ['#ff6f61','#ffc93c','#5ec269','#4fb0e0','#9b6bd9','#ff9740'];

  // ---------- state ----------
  let chosenFinger = null; // finger group object or {id:'all', name:'Tất cả các ngón', keys: ALL_KEYS}
  let chosenSpeed = null;

  // ---------- xây dựng lưới chọn ngón tay ----------
  const fingerGrid = document.getElementById('fingerGrid');

  FINGER_GROUPS.forEach(f=>{
    const btn = document.createElement('div');
    btn.className = 'finger-btn';
    btn.dataset.id = f.id;
    btn.innerHTML = `<span class="hand-dot"></span>${f.name}<span class="keys">${f.keys.join(' ')}</span>`;
    btn.addEventListener('click', ()=> selectFinger(f, btn));
    fingerGrid.appendChild(btn);
  });
  const allBtn = document.createElement('div');
  allBtn.className = 'finger-btn all-fingers';
  allBtn.dataset.id = 'all';
  allBtn.innerHTML = `<span class="hand-dot"></span>Tất cả các ngón (10 ngón)<span class="keys">${ALL_KEYS.join(' ')}</span>`;
  allBtn.addEventListener('click', ()=> selectFinger({id:'all', name:'Tất cả các ngón', keys: ALL_KEYS}, allBtn));
  fingerGrid.appendChild(allBtn);

  function selectFinger(f, el){
    chosenFinger = f;
    document.querySelectorAll('.finger-btn').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
    updateHint();
    checkReady();
  }

  // ---------- chọn tốc độ ----------
  document.querySelectorAll('.speed-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      chosenSpeed = btn.dataset.speed;
      document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      updateHint();
      checkReady();
    });
  });

  const hintEl = document.getElementById('hint');
  function updateHint(){
    if(!chosenFinger && !chosenSpeed){ hintEl.textContent = 'Hãy chọn ngón tay và tốc độ nhé!'; return; }
    if(!chosenFinger){ hintEl.textContent = 'Còn thiếu: chọn ngón tay muốn luyện.'; return; }
    if(!chosenSpeed){ hintEl.textContent = 'Còn thiếu: chọn tốc độ rơi.'; return; }
    hintEl.textContent = `Sẵn sàng luyện "${chosenFinger.name}" - tốc độ ${SPEED_LABELS[chosenSpeed]}!`;
  }
  function checkReady(){
    document.getElementById('startBtn').disabled = !(chosenFinger && chosenSpeed);
  }

  // ---------- bắt đầu trò chơi ----------
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('stopBtn').addEventListener('click', ()=> endGame(true));

  const setupEl = document.getElementById('game') && document.getElementById('setup');
  const gameEl = document.getElementById('game');
  const playfield = document.getElementById('playfield');
  const scoreValEl = document.getElementById('scoreVal');
  const timeLeftEl = document.getElementById('timeLeft');
  const timeChip = document.getElementById('timeChip');
  const fingerLabelEl = document.getElementById('fingerLabel');

  const GAME_SECONDS = 10 * 60;
  let score = 0;
  let missedCount = 0;
  let secondsRemaining = GAME_SECONDS;
  let timerInterval = null;
  let spawnInterval = null;
  let rafId = null;
  let activeLetters = []; // {el, top, speedPxPerSec}
  let gameRunning = false;
  let lastFrameTime = 0;

  function startGame(){
    document.getElementById('setup').style.display = 'none';
    gameEl.style.display = 'flex';
    fingerLabelEl.textContent = chosenFinger.name;
    score = 0; missedCount = 0;
    secondsRemaining = GAME_SECONDS;
    scoreValEl.textContent = '0';
    updateTimeDisplay();
    timeChip.classList.remove('warning');
    activeLetters.forEach(l=> l.el.remove());
    activeLetters = [];
    gameRunning = true;

    const cfg = SPEED_CONFIG[chosenSpeed];

    timerInterval = setInterval(()=>{
      secondsRemaining--;
      updateTimeDisplay();
      if(secondsRemaining <= 30) timeChip.classList.add('warning');
      if(secondsRemaining <= 0){
        endGame(false);
      }
    }, 1000);

    spawnInterval = setInterval(spawnLetter, cfg.spawnMs);
    spawnLetter();
    lastFrameTime = performance.now();
    rafId = requestAnimationFrame(tick);

    window.addEventListener('keydown', onKeyDown);
  }

  function updateTimeDisplay(){
    const m = Math.floor(Math.max(secondsRemaining,0) / 60);
    const s = Math.max(secondsRemaining,0) % 60;
    timeLeftEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function spawnLetter(){
    if(!gameRunning) return;
    const keys = chosenFinger.keys;
    const letter = keys[Math.floor(Math.random()*keys.length)];
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];

    const el = document.createElement('div');
    el.className = 'falling-letter';
    el.textContent = letter;
    el.style.background = color;

    const fieldWidth = playfield.clientWidth;
    const maxLeft = Math.max(fieldWidth - 66, 20);
    const left = 10 + Math.random() * maxLeft;
    el.style.left = left + 'px';
    el.style.top = '-60px';

    playfield.appendChild(el);

    const cfg = SPEED_CONFIG[chosenSpeed];
    activeLetters.push({ el, top: -60, speed: cfg.fall, letter });
  }

  function tick(now){
    if(!gameRunning) return;
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    const fieldHeight = playfield.clientHeight;

    for(let i = activeLetters.length - 1; i >= 0; i--){
      const item = activeLetters[i];
      item.top += item.speed * dt;
      item.el.style.top = item.top + 'px';
      if(item.top > fieldHeight - 20){
        item.el.classList.add('missed');
        missedCount++;
        setTimeout(()=> item.el.remove(), 350);
        activeLetters.splice(i,1);
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function onKeyDown(e){
    if(!gameRunning) return;
    const key = e.key.toUpperCase();
    if(key.length !== 1) return;
    // Tìm chữ cái phù hợp gần mặt đất nhất (rơi lâu nhất)
    let bestIdx = -1, bestTop = -Infinity;
    for(let i=0;i<activeLetters.length;i++){
      if(activeLetters[i].letter === key && activeLetters[i].top > bestTop){
        bestTop = activeLetters[i].top;
        bestIdx = i;
      }
    }
    if(bestIdx === -1) return;
    const item = activeLetters[bestIdx];
    item.el.classList.add('pop');
    setTimeout(()=> item.el.remove(), 250);
    activeLetters.splice(bestIdx,1);
    score++;
    scoreValEl.textContent = score;
  }

  function endGame(manualStop){
    gameRunning = false;
    clearInterval(timerInterval);
    clearInterval(spawnInterval);
    cancelAnimationFrame(rafId);
    window.removeEventListener('keydown', onKeyDown);
    activeLetters.forEach(l=> l.el.remove());
    activeLetters = [];
    showResult(manualStop);
  }

  function showResult(manualStop){
    const flash = document.createElement('div');
    flash.id = 'finish-flash';
    const minutesPlayed = ((GAME_SECONDS - secondsRemaining) / 60).toFixed(1);
    let praise = 'Cố lên nào, luyện thêm là giỏi ngay! 💪';
    if(score >= 150) praise = 'Xuất sắc! Ngón tay bay như gió! 🌟';
    else if(score >= 80) praise = 'Rất giỏi! Gõ nhanh và chính xác! 🎉';
    else if(score >= 30) praise = 'Tốt lắm! Tiếp tục luyện tập nhé! 👍';

    flash.innerHTML = `
      <div class="result-card">
        <h2>${manualStop ? '⏹ Đã dừng luyện tập' : '🎉 Hết giờ!'}</h2>
        <div class="score-label">SỐ CHỮ GÕ ĐÚNG</div>
        <div class="big-score">${score}</div>
        <div class="stats">
          <div class="stat-box"><div class="num">${minutesPlayed}</div><div class="lbl">PHÚT ĐÃ LUYỆN</div></div>
          <div class="stat-box"><div class="num">${missedCount}</div><div class="lbl">CHỮ BỊ RƠI</div></div>
        </div>
        <p class="praise">${praise}</p>
        <button class="again-btn" id="againBtn">🔁 Luyện lại</button>
      </div>
    `;
    gameEl.appendChild(flash);
    launchConfetti(flash);

    document.getElementById('againBtn').addEventListener('click', ()=>{
      flash.remove();
      gameEl.style.display = 'none';
      document.getElementById('setup').style.display = 'flex';
    });
  }

  function launchConfetti(container){
    const colors = COLORS;
    for(let i=0;i<40;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + '%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2 + Math.random()*1.5) + 's';
      c.style.animationDelay = (Math.random()*0.4) + 's';
      container.appendChild(c);
      setTimeout(()=> c.remove(), 4000);
    }
  }
})();
</script>

</body>
</html>
